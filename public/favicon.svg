<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="16" fill="#101114" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#2A2E37" stroke-width="1" />
  
  <!-- Subtle background glow -->
  <circle cx="32" cy="32" r="18" fill="url(#core-glow)" opacity="0.3" />
  
  <!-- Abstract Bridge Geometry -->
  <!-- Primary Arch -->
  <path d="M14 42C14 26 23 18 32 18C41 18 50 26 50 42" stroke="url(#bridge-grad-1)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Inverse Structural Arch -->
  <path d="M18 46C24 38 40 38 46 46" stroke="url(#bridge-grad-2)" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
  
  <!-- Central Nexus Beam -->
  <line x1="32" y1="18" x2="32" y2="40" stroke="url(#bridge-grad-3)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 3" />
  
  <!-- Keystone Node -->
  <circle cx="32" cy="18" r="3" fill="#38BDF8" />
  <circle cx="32" cy="18" r="5" stroke="#38BDF8" stroke-width="1" opacity="0.6" />

  <defs>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bridge-grad-1" x1="14" y1="18" x2="50" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7F7F5" />
      <stop offset="0.5" stop-color="#38BDF8" />
      <stop offset="1" stop-color="#747982" />
    </linearGradient>
    <linearGradient id="bridge-grad-2" x1="18" y1="38" x2="46" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#E8E9EB" />
    </linearGradient>
    <linearGradient id="bridge-grad-3" x1="32" y1="18" x2="32" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" />
      <stop offset="1" stop-color="#101114" />
    </linearGradient>
  </defs>
</svg>
