<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" fill="none">
  <!-- Background with dark graphite depth -->
  <rect width="1200" height="630" fill="#101114" />
  
  <!-- Subtle architectural grid -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#202329" stroke-width="0.75" />
    </pattern>
    <radialGradient id="radial-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#101114" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A1A1AA" />
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="600" cy="240" r="380" fill="url(#radial-glow)" />

  <!-- Abstract Bridge Graphic -->
  <g transform="translate(600, 180) scale(1.6)">
    <!-- Bridge curves -->
    <path d="M -70 40 C -70 0 -25 -25 0 -25 C 25 -25 70 0 70 40" stroke="#E8E9EB" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M -50 48 C -25 25 25 25 50 48" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.8" />
    <line x1="0" y1="-25" x2="0" y2="35" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="3 3" />
    <circle cx="0" cy="-25" r="4.5" fill="#38BDF8" />
    <circle cx="0" cy="-25" r="8" stroke="#38BDF8" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Tagline Badge -->
  <rect x="440" y="270" width="320" height="34" rx="17" fill="#202329" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="1" />
  <text x="600" y="292" fill="#38BDF8" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="600" letter-spacing="3" text-anchor="middle">AN UPCOMING HEALTH-TECH VENTURE</text>

  <!-- Brand Wordmark -->
  <text x="600" y="380" fill="url(#text-grad)" font-family="'Plus Jakarta Sans', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5" text-anchor="middle">SETU247</text>

  <!-- Headline -->
  <text x="600" y="440" fill="#E8E9EB" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="500" letter-spacing="-0.5" text-anchor="middle">Something Meaningful Is Coming.</text>

  <!-- Ownership line -->
  <text x="600" y="520" fill="#747982" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="400" letter-spacing="1.5" text-anchor="middle">BY OXYSQUAD TECHNOLOGIES PVT LTD</text>
</svg>
